<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#035667" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Colibri Cosmetics</title>

    <!-- Aloqani oldindan ochamiz: LTE'da har bir yangi domen ~0.3-0.8s oladi -->
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://k-beauty-0rv9.onrender.com" crossorigin />

    <style>
      /* Shu uslublar HTML ichida — tashqi CSS kelmasa ham ekran oq qolmaydi */
      html, body { margin: 0; padding: 0; background: #fff; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #7b8794;
        font-size: 14px;
      }
      #boot .mark { font-size: 40px; }
      #boot .logo { width: 84px; height: 84px; border-radius: 22px; }
      #boot .ring {
        width: 26px;
        height: 26px;
        border: 3px solid #d6e9ed;
        border-top-color: #035667;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #boot button {
        margin-top: 6px;
        padding: 11px 26px;
        border: none;
        border-radius: 999px;
        background: #035667;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- App yuklanguncha ko'rinadigan ekran. React chizilishi bilan o'chadi. -->
      <div id="boot">
        <img class="logo" src="/icon.webp" alt="Colibri Cosmetics" />
        <div class="ring"></div>
        <div id="boot-text">Yuklanmoqda...</div>
      </div>
    </div>

    <!--
      Telegram skripti ilgari <head> da edi va butun sahifani to'sib turardi:
      telegram.org sekin javob bersa mijoz OQ EKRAN ko'rardi. Endi u sahifa
      chizilgandan keyin yuklanadi, lekin baribir main.jsx dan oldin ishlaydi
      (module skriptlar har doim oxirida bajariladi).
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Agar app 12 soniyada ochilmasa yoki skript umuman yuklanmasa —
      // mijoz oq ekranga qarab qolmasin, tushunarli xabar chiqsin.
      (function () {
        var shown = false;

        function fail(message) {
          if (shown) return;
          var boot = document.getElementById('boot');
          if (!boot) return; // React allaqachon chizgan
          shown = true;
          boot.innerHTML =
            '<div class="mark">😔</div>' +
            '<div>' + message + '</div>' +
            '<button onclick="location.reload()">Qayta urinish</button>';
        }

        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') {
            fail('Do‘kon yuklanmadi. Internetni tekshiring.');
          }
        }, true);

        setTimeout(function () {
          fail('Juda uzoq kutildi. Internetni tekshirib qaytadan urinib ko‘ring.');
        }, 12000);
      })();
    </script>
  </body>
</html>
